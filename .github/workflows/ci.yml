name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-conformance:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked --extra test
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Run Python conformance
        run: uv run pytest -q tests/test_cli_contract.py
        env:
          GETGO_ENTRYPOINTS: python

  artifacts-and-alpine:
    name: Fat APE, packages, and Alpine
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked --extra test --extra ape
      - name: Build and validate fat APE
        shell: bash
        run: |
          uv run python scripts/build_ape.py
          first_sha="$(sha256sum dist/getgo | cut -d' ' -f1)"
          uv run python scripts/build_ape.py
          second_sha="$(sha256sum dist/getgo | cut -d' ' -f1)"
          test "$first_sha" = "$second_sha"
          uv run python scripts/check_ape.py
      - name: Build wheel and sdist
        run: uv build
      - name: Run shared Python and APE conformance
        run: uv run pytest -q tests/test_cli_contract.py
        env:
          GETGO_ENTRYPOINTS: python,ape
      - name: Smoke built artifacts
        run: uv run pytest -q tests/test_artifacts.py
        env:
          GETGO_TEST_BUILT_DISTS: "1"
      - name: Run conformance from the installed wheel
        shell: bash
        run: |
          uv venv "$RUNNER_TEMP/getgo-wheel"
          uv pip install --python "$RUNNER_TEMP/getgo-wheel/bin/python" dist/*.whl
          GETGO_ENTRYPOINTS=installed \
          GETGO_INSTALLED_COMMAND="$RUNNER_TEMP/getgo-wheel/bin/getgo" \
            uv run pytest -q tests/test_cli_contract.py
      - name: Run stock Alpine network gate
        run: uv run pytest -q tests/test_alpine.py
        env:
          GETGO_RUN_ALPINE: "1"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: getgo-${{ github.sha }}
          path: dist/*
          if-no-files-found: error

  native-ape-smoke:
    name: Native APE (${{ matrix.os }})
    needs: artifacts-and-alpine
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: getgo-${{ github.sha }}
          path: dist
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Run shared native Windows conformance
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          uv sync --locked --extra test
          $env:GETGO_ENTRYPOINTS = "ape"
          uv run pytest -q tests/test_cli_contract.py
      - name: Smoke APE startup, uv delegation, PATH, and exit code
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x dist/getgo
          export UV_TOOL_DIR="$RUNNER_TEMP/uv-tools"
          export UV_TOOL_BIN_DIR="$RUNNER_TEMP/uv-bin"
          export PATH="$UV_TOOL_BIN_DIR:$PATH"
          test "$(/bin/sh dist/getgo --version)" = "getgo 0.1.0"
          /bin/sh dist/getgo pycowsay
          pycowsay getgo
          set +e
          /bin/sh dist/getgo --definitely-invalid
          code=$?
          set -e
          test "$code" -eq 2
      - name: Smoke PE startup, uv delegation, PATH, and exit code
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item -LiteralPath dist/getgo -Destination dist/getgo.com
          $env:UV_TOOL_DIR = "$env:RUNNER_TEMP\uv-tools"
          $env:UV_TOOL_BIN_DIR = "$env:RUNNER_TEMP\uv-bin"
          New-Item -ItemType Directory -Force -Path $env:UV_TOOL_BIN_DIR | Out-Null
          $env:Path = "$env:UV_TOOL_BIN_DIR;$env:Path"
          $version = & dist/getgo.com --version
          if ($LASTEXITCODE -ne 0 -or $version -ne "getgo 0.1.0") { throw "version smoke failed" }
          & dist/getgo.com pycowsay
          if ($LASTEXITCODE -ne 0) { throw "install smoke failed" }
          pycowsay getgo
          if ($LASTEXITCODE -ne 0) { throw "PATH smoke failed" }
          & dist/getgo.com --definitely-invalid 2>$null
          if ($LASTEXITCODE -ne 2) { throw "exit-code smoke failed: $LASTEXITCODE" }
